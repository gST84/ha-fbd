<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3a5f"/><stop offset="1" stop-color="#0f1c2e"/></linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe6f3"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- wires -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 98 H78" stroke="#5b7391"/>
    <path d="M26 158 H52 V158 H78" stroke="#3ddc84" filter="url(#glow)"/>
    <path d="M178 128 H230" stroke="#3ddc84" filter="url(#glow)"/>
  </g>
  <!-- function block -->
  <rect x="78" y="62" width="100" height="132" rx="14" fill="url(#blk)" stroke="#3ddc84" stroke-width="6"/>
  <!-- pins -->
  <circle cx="78" cy="98" r="8" fill="#5b7391"/><circle cx="78" cy="158" r="8" fill="#3ddc84"/><circle cx="178" cy="128" r="8" fill="#3ddc84"/>
  <!-- AND-like symbol: & -->
  <text x="128" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="54" fill="#1f3a5f">≥1</text>
</svg>
