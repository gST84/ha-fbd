<script>/* apply the theme before the first paint */
try{var m=localStorage.getItem("fbd.theme"),d=m==="dark";if(m!=="light"&&m!=="dark"){var h=null;try{var ha=window.parent!==window&&window.parent.document.querySelector("home-assistant");if(ha&&ha.hass&&ha.hass.themes)h=!!ha.hass.themes.darkMode}catch(e){}d=h!==null?h:window.matchMedia("(prefers-color-scheme: dark)").matches}document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
