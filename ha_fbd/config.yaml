name: FBD Automation
version: "0.5.2"
slug: ha_fbd
description: IEC 61131-3 function block diagram editor and runtime for Home Assistant
url: https://github.com/gST84/ha-fbd
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:sitemap
panel_title: FBD Automation
panel_admin: true
options:
  scan_ms: 100
  write_on_first_scan: true
  log_level: info
schema:
  scan_ms: "int(20,1000)"
  write_on_first_scan: bool
  log_level: "list(debug|info|warning|error)"
